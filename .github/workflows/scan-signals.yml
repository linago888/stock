name: 每日領先訊號掃描

on:
  schedule:
    # 每個交易日晚間 21:30 台灣時間 (13:30 UTC) — 收盤後半小時
    # 避開盤後重訊高峰前後
    - cron: "30 13 * * 1-5"
  workflow_dispatch: {}   # 允許手動觸發

permissions:
  contents: write

concurrency:
  group: scan-signals
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests beautifulsoup4 lxml pandas

      - name: Scan latest watchlist (500 stocks × 14 days)
        run: |
          python news_signals/scan_watchlist_deep.py \
            --limit 500 --days 14 --min-volume 2000000
        env:
          PYTHONIOENCODING: utf-8

      - name: Rebuild signals bundle for Vercel
        run: python signals_bundle.py

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/watchlist_scan.json data/signals_bundle.json.gz data/mops/*.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "chore(cron): refresh watchlist scan $(date -u +%Y-%m-%d)"
          # Retry with rebase to survive concurrent pushes from local dev / other runs
          for i in 1 2 3 4 5; do
            git pull --rebase --autostash origin main || true
            if git push; then
              echo "pushed on attempt $i"
              exit 0
            fi
            echo "push attempt $i failed, retrying…"
            sleep $((i * 3))
          done
          echo "push failed after 5 attempts"
          exit 1
